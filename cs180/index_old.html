<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS180 Projects</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#111; --ink-2:#555; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 980px;
    }
    h1 {
      font-weight: 600;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
      margin: 0 0 20px 0;
      color: var(--ink-2);
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 4 / 3;
      text-decoration: none;
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      border-color: #d1d5db;
      outline: none;
    }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
  </style>
</head>
<body>
  <main class="wrap" aria-labelledby="title">
    <h1 id="title">CS180 Projects</h1>
    <nav class="grid" aria-label="Projects">
      <a class="card" href="./0/index.html">Project 0</a>
      <a class="card" href="./1/index.html">Project 1</a>
      <a class="card" href="./2/index.html">Project 2</a>
      <a class="card" href="./3/index.html">Project 3</a>
      <a class="card" href="./4/index.html">Project 4</a>
      <a class="card" href="./5/index.html">Project 5</a>
    </nav>
  </main>
</body>
</html>
